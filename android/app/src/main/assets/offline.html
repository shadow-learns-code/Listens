<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d11">
  <title>Offline · Shadow Listens</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
           background: radial-gradient(ellipse 120% 80% at 50% 0%, #2a1520, #0c0d11 60%); color: #eceef3;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 22rem; }
    h1 { font-size: 1.4rem; margin: 1rem 0 .4rem; }
    p { margin: 0 0 1.4rem; color: #a6aab6; line-height: 1.5; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: .8rem 1.6rem; background: #f0587a; color: #0c0d11; }
    button:active { transform: scale(.96); }
  </style>
</head>
<body>
  <main>
    <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true"><path d="M22 4.5A12.5 12.5 0 1 0 27.5 22 10 10 0 0 1 22 4.5z" fill="#f0587a"/><g fill="#0c0d11"><rect x="11" y="13" width="2" height="6" rx="1"/><rect x="15" y="10" width="2" height="12" rx="1"/><rect x="19" y="14" width="2" height="4" rx="1"/></g></svg>
    <h1>You're offline</h1>
    <p>Shadow Listens streams your music from the internet. Reconnect and it picks up right where you left off.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    // Inside the Android app the button asks the app to reload the site; the page also retries by itself when the connection returns.
    function retry() { if (window.NativeApp) window.NativeApp.retry(); else location.reload(); }
    document.getElementById("retry").addEventListener("click", retry);
    window.addEventListener("online", retry);
    // a brief dropout (or the phone still waking its connection) should not need a tap: try again by itself
    setInterval(function () { if (navigator.onLine !== false) retry(); }, 8000);
  </script>
</body>
</html>
